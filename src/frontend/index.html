<!doctype html>

<head>
  <link rel="stylesheet" href="./css/index.css" />
  <script src="."></script>
</head>

<body>
  <pre id="bootstrap"></pre>
  <app-root hidden> </app-root>

  <!-- TEMPLATES -->
  <template id="app-root">
    <menu id="main_menu">
      <div name="portfolio" link>Portfolio</div>
      <div name="accounts" link>Accounts</div>
      <div name="insight" link>Insight</div>
      <div name="map" link>Map</div>
      <div name="dropdown">
        <button>+</button>
        <expanding-drawer name="dropdown_menu" transition="0.5">
          <ul>
            <li name="login" class="enable">login</li>
            <li name="logout" class="disable">logout</li>
          </ul>
        </expanding-drawer>
      </div>
    </menu>
    <div class="wrapper">
      <instrmnts-root root> </instrmnts-root>
      <accounts-root root> </accounts-root>
      <insight-root root> </insight-root>
      <map-root root></map-root>
    </div>
  </template>
  <!-- ACCOUNTS -->
  <template id="accounts-root">
    <h1>Accounts</h1>
    <div class="grid header">
      <div name="broker">broker</div>
      <div name="assets_val">market value</div>
      <div name="cash">cash</div>
      <div name="total">total</div>
    </div>
    <div class="grid money">
      <div name="broker"></div>
      <div name="name"></div>
      <div name="currency"></div>
      <money-str name="assets_val" currency="€"></money-str>
      <money-str name="cash" currency="€"></money-str>
      <money-str name="total" currency="€"></money-str>
    </div>
    <div class="wrapper brokers"></div>
  </template>
  <!-- broker row -->
  <template id="accounts-broker">
    <div class="header grid">
      <div name="broker"></div>
      <money-str name="assets_val" currency="€"></money-str>
      <money-str name="cash" currency="€"></money-str>
      <money-str name="total" currency="€"></money-str>
    </div>
    <div class="wrapper accounts"></div>
  </template>
  <!-- account row -->
  <template id="account-row">
    <div class="header grid">
      <div name="name"></div>
      <money-str name="assets_val" currency="€"></money-str>
      <money-str name="cash" currency="€"></money-str>
      <money-str name="total" currency="€"></money-str>
    </div>
    <div class="wrapper balances"></div>
  </template>
  <!-- balance row -->
  <template id="balance-row">
    <div class="grid">
      <div name="currency"></div>
      <money-str name="assets_val"></money-str>
      <money-str name="cash"></money-str>
      <money-str name="total"></money-str>
    </div>
  </template>
  <!-- FILTER -->
  <template id="filter-root">
    <form>
      <div>
        <label for="broker-select">Broker:</label>
        <select name="broker" id="broker-select"></select>
      </div>
      <div>
        <label for="a_id">Account:</label>
        <select name="a_id"></select>
      </div>
    </form>
    <form>
      <div>
        <label for="sector-select">Sector:</label>
        <select name="asset_sector" id="sector-select"></select>
      </div>
      <div>
        <label for="industry-select">Industry:</label>
        <select name="asset_industry" id="industry-select"></select>
      </div>
    </form>
    <form>
      <div>
        <label for="country-select">Country:</label>
        <select name="country_qid" id="country-select"></select>
      </div>
      <div>
        <label for="region-select">Region:</label>
        <select name="region_qid" id="region-select"></select>
      </div>
      <div>
        <label for="place-select">Place:</label>
        <select name="place_qid" id="place-select"></select>
      </div>
    </form>
    <form>
      <div>
        <label for="search">search:</label>
        <input type="search" name="search" filter />
      </div>
    </form>
  </template>
  <!-- INSTRUMENTS -->
  <template id="instrmnts-root">
    <h1>Portfolio</h1>
    <div class="header wrapper">
      <filter-root></filter-root>
      <!--
      <div class="filter wrapper">
        <div class="inner">
          <form>
            <select-broker name="broker" filter select></select-broker>
            <select-account name="a_id" filter select></select-account>
          </form>
          <form>
            <select-sector name="asset_sector" filter select></select-sector>
            <select-industry
              name="asset_industry"
              filter
              select
            ></select-industry>
          </form>
          <form>
            <select-country name="country" filter select></select-country>
            <select-region name="region" filter select></select-region>
            <select-place name="place" filter select></select-place>
          </form>
          <form>
            <label for="search">search:</label>
            <input type="search" name="search" filter />
          </form>
        </div>
      </div>
      -->
      <div class="grid pl_ur">
        <div name="pl_ur" number>unrl p/l</div>
        <money-str name="pl_ur_total" currency="€" pl bold></money-str>
        <div name="rem">dividends</div>
      </div>
      <div class="grid header">
        <div name="description"><div class="cell">description</div></div>
        <div name="ticker"><div class="cell">ticker</div></div>
        <div name="transctns" number>transctns</div>
        <div name="traded_value" number>traded value</div>
        <div name="market_value" number>market value</div>
        <div name="pl_r" number>rl p/l</div>
        <div name="pl_ur" number></div>
        <div name="pl_fx" number>fx</div>
        <div name="pl_ur_perc" number>%</div>
        <div name="div_val" number>(ytd)</div>
        <div name="div_est" number>est (cy)</div>
        <div name="div_yield" number>yield</div>
      </div>
      <div class="grid money">
        <div name="description"></div>
        <div name="ticker"></div>
        <div name="transctns"></div>
        <money-str name="traded_value" currency="€" bold></money-str>
        <money-str name="market_value" currency="€" bold></money-str>
        <money-str name="pl_r" currency="€" pl bold></money-str>
        <money-str name="pl_ur" currency="€" pl bold></money-str>
        <money-str name="pl_fx" currency="€" pl bold></money-str>
        <percent-str name="pl_ur_perc" pl bold></percent-str>
        <money-str name="div_val" currency="€" bold></money-str>
        <money-str name="div_est" currency="€" bold></money-str>
        <percent-str name="div_yield" bold></percent-str>
      </div>
    </div>
    <div class="instruments wrapper"></div>
  </template>
  <!-- instrument row -->
  <template id="instrmnt-row" class="row instrmnt">
    <div class="grid instrmnt">
      <div name="description">
        <a><span></span></a>
      </div>
      <div name="ticker"><button></button></div>
      <div name="transctns"><button></button></div>
      <money-str name="traded_value" currency="€"></money-str>
      <money-str name="market_value" currency="€"></money-str>
      <money-str name="pl_r" currency="€" pl></money-str>
      <money-str name="pl_ur" currency="€" pl></money-str>
      <money-str name="pl_fx" currency="€" pl></money-str>
      <percent-str name="pl_ur_perc" pl></percent-str>
      <money-str name="div_val" currency="€"></money-str>
      <money-str name="div_est" currency="€"></money-str>
      <percent-str name="div_yield"></percent-str>
    </div>
    <expanding-drawer name="pos_drawer"
      ><positns-root></positns-root
    ></expanding-drawer>
    <expanding-drawer name="info_drawer">
      <div class="header">
        <div class="breadcrumb">
          <a class="sector"></a><a class="industry"></a>
        </div>
        <div class="currency"></div>
      </div>
      <instrmnt-chart></instrmnt-chart>
      <div name="about_company"></div>
      <div name="live_data"></div>
    </expanding-drawer>
  </template>

  <!-- instrument chart-->
  <template id="instrmnt-chart"></template>

  <!-- POSITIONS -->
  <template id="position-root">
    <div class="wrapper positn">
      <div class="grid positn">
        <div name="date">date</div>
        <div name="kind"></div>
        <div name="broker">broker</div>
        <div name="closed"></div>
        <div name="amount">pos</div>
        <div name="traded_value"></div>
        <div name="market_value"></div>
        <money-str name="pl_r" currency="€"></money-str>
        <div name="pl_ur"></div>
        <div name="pl_fx"></div>
        <div name="pl_ur_perc"></div>
        <div name="div_val"></div>
        <div name="div_est"></div>
        <div name="div_yield"></div>
      </div>
      <div class="wrapper rows"></div>
    </div>
  </template>
  <!-- transctn row -->
  <template id="transctn-row" class="grid transctn">
    <date-str name="date"></date-str>
    <any-str name="kind"></any-str>
    <any-str name="broker"></any-str>
    <any-str name="sales"></any-str>
    <any-str name="amount"></any-str>
    <money-str name="traded_value" currency="€"></money-str>
    <money-str name="market_value" currency="€"></money-str>
    <money-str name="pl_r" currency="€" pl></money-str>
    <money-str name="pl_ur" currency="€" pl></money-str>
    <money-str name="pl_fx" currency="€" pl></money-str>
    <div name="pl_ur_perc"></div>
    <money-str name="div_val" currency="€"></money-str>
    <div name="div_est"></div>
    <div name="div_yield"></div>
  </template>
  <!-- INSIGHT -->
  <!-- insight-root -->
  <template id="insight-root">
    <h1>Insight</h1>
    <div class="header">
      <div class="grid insight">
        <div name="topic"></div>
        <div name="value">Market Value</div>
        <div name="pl_ur">ur P/L</div>
        <div name="percent">
          <div class="buttons">
            <button name="sectors">sectors</button>
            <button name="locations">locations</button>
          </div>
        </div>
      </div>
    </div>
    <div class="content">
      <insight-view view="sectors"></insight-view>
      <insight-view view="locations"></insight-view>
    </div>
  </template>
  <!-- insight view -->
  <template id="insight-view">
    <div class="content"></div>
  </template>
  <!-- insight-row -->
  <template id="insight-row">
    <div class="grid">
      <div name="topic"><a target="blank"></a></div>
      <money-str name="value" currency="€"></money-str>
      <percent-str name="pl_ur" pl></percent-str>
      <div name="percent">
        <div class="bar"></div>
        <div class="value"></div>
      </div>
    </div>
    <div class="children"></div>
  </template>
  <!-- MAP -->
  <template id="map-root">
    <h1>Map</h1>
    <div id="map_container"></div>
  </template>
  <!-- WIDGETS -->
  <template id="select-widget">
    <span>
      <label></label>
      <select></select>
    </span>
  </template>

  <template id="expanding-drawer">
    <div class="inner"></div>
  </template>
</body>
