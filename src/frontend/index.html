<!doctype html>

<head>
  <link rel="stylesheet" href="./css/index.css" />
  <script src="."></script>
</head>

<body>
  <app-root>
    <h1>Accounts</h1>
    <accounts-root> </accounts-root>
    <h1>Stocks</h1>
    <stocks-root> </stocks-root>
  </app-root>

  <!-- account -->
  <template id="accounts-root">
    <div class="grid">
      <div class="row header">
        <div>broker</div>
        <div>alias</div>
        <div>currency</div>
        <div>id</div>
      </div>
    </div>
  </template>
  <template id="account-row">
    <div name="broker"></div>
    <div name="alias"></div>
    <div name="currency"></div>
    <div name="id"></div>
  </template>

  <!-- stock -->
  <template id="stocks-root">
    <select-broker></select-broker>
    <div class="grid">
      <div class="row header">
        <div name="description"><div class="cell">description</div></div>
        <div name="ticker"><div class="cell">ticker</div></div>
        <div name="buy_value">buy</div>
        <div name="market_value">market</div>
        <div name="pl">p/l</div>
        <div name="fx_pl">fx p/l</div>
        <div name="positions">positions</div>
      </div>
      <div class="row money">
        <div name="description"></div>
        <div name="ticker"></div>
        <money-string
          name="buy_value"
          currency="€"
          class="first"
        ></money-string>
        <money-string name="market_value" currency="€"></money-string>
        <money-string name="pl" currency="€" pl></money-string>
        <money-string name="fx_pl" currency="€" pl class="last"></money-string>
        <div name="positions"></div>
      </div>
    </div>
  </template>
  <template id="stock-row">
    <!--<border></border>-->
    <div name="description"></div>
    <div name="ticker"></div>
    <money-string name="buy_value" currency="€"></money-string>
    <money-string name="market_value" currency="€"></money-string>
    <money-string name="pl" currency="€" pl></money-string>
    <money-string name="fx_pl" currency="€" pl></money-string>
    <div name="positions" class="center"></div>
    <positions-root></positions-root>
  </template>

  <!-- position -->
  <template id="position-root">
    <div class="grid">
      <div class="header row">
        <div name="exchange">exch.</div>
        <div name="date">date</div>
        <div name="position">position</div>
        <div name="buy_value">buy</div>
        <div name="market_value">market</div>
        <div name="pl">p/l</div>
        <div name="fx_pl">fx p/l</div>
        <div name="broker">broker</div>
      </div>
    </div>
  </template>

  <template id="position-row">
    <div name="exchange" class="center"></div>
    <date-string name="date"></date-string>
    <div name="position" class="center"></div>
    <money-string name="buy_value" currency="€"></money-string>
    <money-string name="market_value" currency="€"></money-string>
    <money-string name="pl" currency="€" pl></money-string>
    <money-string name="fx_pl" currency="€" pl></money-string>
    <div name="broker" class="center"></div>
  </template>
</body>

<!-- widgets -->

<template id="select-widget">
  <span>
    <label></label>
    <select></select>
  </span>
</template>
