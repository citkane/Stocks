<!doctype html>

<head>
  <link rel="stylesheet" href="./css/index.css" />
  <script src="."></script>
</head>

<body>
  <pre id="bootstrap"></pre>
  <app-root hidden>
    <menu id="main_menu">
      <div name="portfolio" link>Portfolio</div>
      <div name="accounts" link>Accounts</div>
      <div name="insight" link>Insight</div>
      <div name="dropdown">
        <div button>+</div>
        <expanding-drawer name="dropdown_menu" transition="0.5">
          <ul>
            <li name="login_ibkr">login IBKR</li>
            <li name="logout_ibkr">logout IBKR</li>
            <li name="logout_saxo">logout SAXO</li>
          </ul>
        </expanding-drawer>
      </div>
    </menu>
    <div class="wrapper">
      <instrmnts-root root> </instrmnts-root>
      <accounts-root root> </accounts-root>
      <insight-wrapper root>
        <insight-root
          name="sectors"
          data-keys='["asset_sector", "asset_industry"]'
        ></insight-root>
        <insight-root
          name="locations"
          data-keys='["country", "region", "place"]'
        ></insight-root>
      </insight-wrapper>
    </div>
  </app-root>

  <!-- TEMPLATES -->
  <!-- ACCOUNTS -->
  <template id="accounts-root">
    <h1>Accounts</h1>
    <div class="grid header">
      <div name="broker">broker</div>
      <div name="assets_val">market value</div>
      <div name="cash">cash</div>
      <div name="total">total</div>
    </div>
    <div class="grid money">
      <div name="broker"></div>
      <div name="name"></div>
      <div name="currency"></div>
      <money-str name="assets_val" currency="€"></money-str>
      <money-str name="cash" currency="€"></money-str>
      <money-str name="total" currency="€"></money-str>
    </div>
    <div class="wrapper brokers"></div>
  </template>
  <!-- broker row -->
  <template id="accounts-broker">
    <div class="header grid">
      <div name="broker"></div>
      <money-str name="assets_val" currency="€"></money-str>
      <money-str name="cash" currency="€"></money-str>
      <money-str name="total" currency="€"></money-str>
    </div>
    <div class="wrapper accounts"></div>
  </template>
  <!-- account row -->
  <template id="account-row">
    <div class="header grid">
      <div name="name"></div>
      <money-str name="assets_val" currency="€"></money-str>
      <money-str name="cash" currency="€"></money-str>
      <money-str name="total" currency="€"></money-str>
    </div>
    <div class="wrapper balances"></div>
  </template>
  <!-- balance row -->
  <template id="balance-row">
    <div class="grid">
      <div name="currency"></div>
      <money-str name="assets_val"></money-str>
      <money-str name="cash"></money-str>
      <money-str name="total"></money-str>
    </div>
  </template>

  <!-- INSTRUMENTS -->
  <template id="instrmnts-root">
    <h1>Portfolio</h1>
    <div class="header wrapper">
      <div class="filter wrapper">
        <div class="inner">
          <form>
            <select-broker name="broker" filter select></select-broker>
            <select-account name="a_id" filter select></select-account>
          </form>
          <form>
            <select-sector name="asset_sector" filter select></select-sector>
            <select-industry
              name="asset_industry"
              filter
              select
            ></select-industry>
          </form>
          <form>
            <select-country name="country" filter select></select-country>
            <select-region name="region" filter select></select-region>
            <select-place name="place" filter select></select-place>
          </form>
          <form>
            <label for="search">search:</label>
            <input type="search" name="search" filter />
          </form>
        </div>
      </div>
      <div class="grid u_pl">
        <div name="u_pl">unrl p/l</div>
        <money-str name="u_pl_total" currency="€" pl bold></money-str>
        <div name="rem">dividends</div>
      </div>
      <div class="grid header">
        <div name="description"><div class="cell">description</div></div>
        <div name="ticker"><div class="cell">ticker</div></div>
        <div name="positions" number>transctns</div>
        <div name="traded_value" number>traded value</div>
        <div name="market_value" number>market value</div>
        <div name="r_pl" number>rl p/l</div>
        <div name="u_pl" number></div>
        <div name="fx_pl" number>fx</div>
        <div name="percent_pl" number>%</div>
        <div name="dividend" number>(ytd)</div>
        <div name="div_est" number>est (cy)</div>
        <div name="div_yield" number>yield</div>
      </div>
      <div class="grid money">
        <div name="description"></div>
        <div name="ticker"></div>
        <div name="positions"></div>
        <money-str name="traded_value" currency="€" bold></money-str>
        <money-str name="market_value" currency="€" bold></money-str>
        <money-str name="r_pl" currency="€" pl bold></money-str>
        <money-str name="u_pl" currency="€" pl bold></money-str>
        <money-str name="fx_pl" currency="€" pl bold></money-str>
        <percent-str name="percent_pl" pl bold></percent-str>
        <money-str name="dividend" currency="€" bold></money-str>
        <money-str name="div_est" currency="€" bold></money-str>
        <percent-str name="div_yield" bold></percent-str>
      </div>
    </div>
    <div class="instruments wrapper"></div>
  </template>
  <!-- instrument row -->
  <template id="instrmnt-row" class="row instrmnt">
    <div class="grid instrument">
      <div name="description">
        <a><span></span></a>
      </div>
      <div name="ticker"><button></button></div>
      <div name="positions"><button></button></div>
      <money-str name="traded_value" currency="€"></money-str>
      <money-str name="market_value" currency="€"></money-str>
      <money-str name="r_pl" currency="€" pl></money-str>
      <money-str name="u_pl" currency="€" pl></money-str>
      <money-str name="fx_pl" currency="€" pl></money-str>
      <percent-str name="percent_pl" pl></percent-str>
      <money-str name="dividend" currency="€"></money-str>
      <money-str name="div_est" currency="€"></money-str>
      <percent-str name="div_yield"></percent-str>
    </div>
    <expanding-drawer name="positions_drawer"
      ><positions-root></positions-root
    ></expanding-drawer>
    <expanding-drawer name="info_drawer">
      <div name="header">
        <div class="breadcrumb">
          <a class="sector"></a><a class="industry"></a>
        </div>
        <div class="currency"></div>
      </div>
      <instrmnt-chart></instrmnt-chart>
      <div name="about_company"></div>
      <div name="live_data"></div>
    </expanding-drawer>
  </template>

  <!-- instrument chart-->
  <template id="instrmnt-chart"></template>

  <!-- POSITIONS -->
  <template id="position-root">
    <div class="wrapper positions">
      <div class="grid header">
        <div name="date">date</div>
        <div name="kind"></div>
        <div name="broker">broker</div>
        <div name="closed"></div>
        <div name="amount">pos</div>
        <div name="traded_value"></div>
        <div name="market_value"></div>
        <money-str name="r_pl" currency="€"></money-str>
        <div name="u_pl"></div>
        <div name="fx_pl"></div>
        <div name="percent_pl"></div>
        <div name="dividend"></div>
        <div name="div_est"></div>
        <div name="div_yield"></div>
      </div>
      <div class="wrapper rows"></div>
    </div>
  </template>
  <!-- position row -->
  <template id="position-row" class="grid position">
    <date-str name="date"></date-str>
    <any-str name="kind"></any-str>
    <any-str name="broker"></any-str>
    <any-str name="sales"></any-str>
    <any-str name="amount"></any-str>
    <money-str name="traded_value" currency="€"></money-str>
    <money-str name="market_value" currency="€"></money-str>
    <money-str name="r_pl" currency="€" pl></money-str>
    <money-str name="u_pl" currency="€" pl></money-str>
    <money-str name="fx_pl" currency="€" pl></money-str>
    <div name="percent_pl"></div>
    <money-str name="dividend" currency="€"></money-str>
    <div name="div_est"></div>
    <div name="div_yield"></div>
  </template>
  <!-- INSIGHT -->
  <!-- insight wrapper -->
  <template id="insight-wrapper">
    <h1>Insight</h1>
    <div class="header">
      <div class="grid insight">
        <div name="topic"></div>
        <div name="value">Market Value</div>
        <div name="u_pl">u P/L</div>
        <div name="percent">
          <div class="buttons">
            <button name="sectors">sectors</button
            ><button name="locations">locations</button>
          </div>
        </div>
      </div>
    </div>
    <div class="content"></div>
  </template>
  <!-- insight root -->
  <template id="insight-root">
    <div class="content"></div>
  </template>
  <!-- insight-row -->
  <template id="insight-row">
    <div class="grid">
      <div name="topic"><a target="blank"></a></div>
      <money-str name="value" currency="€"></money-str>
      <percent-str name="u_pl" pl></percent-str>
      <div name="percent">
        <div class="bar"></div>
        <div class="value"></div>
      </div>
    </div>
    <div class="children"></div>
  </template>

  <!-- WIDGETS -->
  <template id="select-widget">
    <span>
      <label></label>
      <select></select>
    </span>
  </template>

  <template id="expanding-drawer">
    <div class="inner"></div>
  </template>
</body>
